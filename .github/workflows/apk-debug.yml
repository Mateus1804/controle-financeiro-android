name: Gerar APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk-debug:
    name: Compilar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validar Gradle Wrapper
        run: python3 scripts/verify-wrapper.py

      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compilar APK de teste (sem chave Release)
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Rendly-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
