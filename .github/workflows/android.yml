name: Qualidade Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Conferir Gradle Wrapper
        run: python3 scripts/verify-wrapper.py
      - name: Conferir contraste dos pares principais
        run: python3 scripts/verify-contrast.py
      - name: Conferir procedência dos casos bancários
        run: |
          python3 scripts/verify-bank-fixtures.py
          python3 scripts/test-bank-fixtures.py
      - name: Preparar SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Conferir recusa de release sem assinatura
        run: |
          if env -u ANDROID_KEYSTORE_PATH -u ANDROID_KEYSTORE_PASSWORD -u ANDROID_KEY_ALIAS -u ANDROID_KEY_PASSWORD ./gradlew --no-daemon --max-workers=2 :app:validateReleaseSigning > "$RUNNER_TEMP/signing-rejected.log" 2>&1; then
            echo "A validação aceitou uma assinatura ausente." >&2
            exit 1
          fi
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          if 'Configure ANDROID_KEYSTORE_PATH' not in (Path(os.environ['RUNNER_TEMP']) / 'signing-rejected.log').read_text():
              raise SystemExit('A recusa não veio da verificação explícita de assinatura.')
          PYTHON
      - name: Preparar chave descartável de compatibilidade
        run: python3 scripts/prepare-test-signing.py
      - name: Testar, analisar e compilar
        run: ./gradlew --no-daemon --max-workers=2 :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Conferir permissões do manifesto mesclado
        run: python3 scripts/verify-manifest.py
      - name: Obter a versão anterior congelada
        uses: actions/checkout@v6
        with:
          ref: 7aec1bd102fcfbfb18eed493ceeb9ca0ac89fefe
          path: ci-legacy
          persist-credentials: false
      - name: Compilar o APK anterior
        working-directory: ci-legacy
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Conferir assinatura e preparar os APKs compatíveis
        run: bash scripts/prepare-compatibility-apks.sh
      - name: Disponibilizar APKs exclusivos de teste
        uses: actions/upload-artifact@v4
        with:
          name: apks-compatibilidade
          path: ci-apks/
          if-no-files-found: error
          retention-days: 7
      - name: Remover a chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/compatibility-signing.jks"
      - name: Disponibilizar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qualidade
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
            app/schemas/
            qa/release-metadata.json
          retention-days: 14

  device:
    name: Android ${{ matrix.api }} · ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 26
            target: default
            scenario: suite
          - api: 33
            target: default
            scenario: suite
          - api: 35
            target: default
            scenario: suite
          - api: 36
            target: google_apis
            scenario: suite
          - api: 35
            target: default
            scenario: upgrade
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar ferramentas do emulador
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator'
      - uses: actions/download-artifact@v5
        with:
          name: apks-compatibilidade
          path: ci-apks
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar compatibilidade, persistência e interface
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run-compatibility-scenario.sh ${{ matrix.scenario }}
      - name: Disponibilizar evidências do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-android-${{ matrix.api }}-${{ matrix.scenario }}
          path: qa/
          if-no-files-found: warn
          retention-days: 14
