name: Qualidade Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Conferir Gradle Wrapper
        run: python3 scripts/verify-wrapper.py
      - name: Preparar SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Testar, analisar e compilar
        run: ./gradlew --no-daemon --max-workers=2 :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Conferir permissões do manifesto mesclado
        run: python3 scripts/verify-manifest.py
      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Disponibilizar APK dos testes
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Disponibilizar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qualidade
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar ferramentas do emulador
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator'
      - uses: actions/download-artifact@v5
        with:
          pattern: controle-financeiro-*
          merge-multiple: true
          path: ci-apks
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar persistência e interface no Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run-device-tests.sh
      - name: Disponibilizar evidências do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-android-15
          path: qa/
          if-no-files-found: warn
          retention-days: 14
